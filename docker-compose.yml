services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Compose MongoDB, not the host .env URI. Local non-Docker runs keep using localhost.
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB_NAME:-ops_mentor_ai}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ops_mentor_ai}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_sessions:/app/sessions
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  voice-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - voice

volumes:
  backend_data:
  backend_uploads:
  backend_sessions:
  mongodb_data:
