# DigitalOcean production override. Local development stays on docker-compose.yml.
#
#   SITE_ADDRESS=app.example.com docker compose \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# A failed build leaves the running containers in place. Do not deploy with
# `docker compose down`.

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
